// Offline-only build-tool patch: installed Kotlin reflection 2.2.0.
// This dependency belongs to AGP, never the app. Normal builds keep AGP defaults.
buildscript {
 if (project.hasProperty('cityOfflineTools')) {
  configurations.classpath.resolutionStrategy.eachDependency { detail ->
   if (detail.requested.group == 'org.jetbrains.kotlin' && detail.requested.name in ['kotlin-reflect','kotlin-stdlib','kotlin-stdlib-jdk7','kotlin-stdlib-jdk8']) detail.useVersion('2.2.0')
  }
 }
}
plugins { id 'com.android.application' version '9.0.1' apply false }
